{% extends "base.html" %}
{% block title %}{{ idea.title }} — 创意详情{% endblock %}

{% block content %}
<div class="page-header">
    <a href="/ideas" class="back-link">← 返回创意列表</a>
    <h1 class="page-title">{{ idea.title }}</h1>
    <span class="page-date">{{ idea.updated_at.strftime('%Y-%m-%d %H:%M') if idea.updated_at else '' }}</span>
</div>

<div class="workspace two-col-layout">
    <!-- 左侧：创意内容 -->
    <div class="panel panel-left">
        <div class="idea-content markdown-body" id="idea-content">
            <!-- Markdown 渲染 -->
        </div>
        <div class="idea-actions">
            <button class="btn btn-primary" onclick="useForOutline({{ idea.id }})">
                📋 基于此创意创建大纲
            </button>
            <button class="btn btn-outline" onclick="editContent()">
                ✏️ 编辑
            </button>
        </div>
    </div>

    <!-- 右侧：对话区 -->
    <div class="panel panel-right chat-panel">
        <h3 class="panel-title">💬 对话修改</h3>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-placeholder">
                <p>在下方输入修改意见，AI 将帮助你完善创意</p>
            </div>
        </div>
        <div class="chat-input-area">
            <textarea id="chat-input" class="form-textarea" rows="2"
                placeholder="输入修改建议，如：增加一个关于信息素交流的设定..."></textarea>
            <button class="btn btn-primary" onclick="sendChat({{ idea.id }})" id="btn-send">
                发送
            </button>
        </div>
    </div>
</div>

<script>
// 页面加载时渲染 Markdown
document.addEventListener('DOMContentLoaded', () => {
    const content = {{ idea.content | tojson | safe }};
    document.getElementById('idea-content').innerHTML = marked.parse(content);

    // 加载对话历史
    const history = {{ idea.chat_history | tojson | safe }};
    try {
        const msgs = JSON.parse(history);
        msgs.forEach(m => appendMessage(m.role, m.content));
    } catch(e) {}
});

async function sendChat(ideaId) {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    appendMessage('user', message);
    input.value = '';
    document.getElementById('btn-send').disabled = true;

    const assistantDiv = appendMessage('assistant', '');
    try {
        const resp = await fetch(`/api/ideas/chat/${ideaId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message})
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream: true});

            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = JSON.parse(line.slice(6));
                    if (data.type === 'text') {
                        assistantDiv.querySelector('.msg-content').textContent += data.content;
                        assistantDiv.querySelector('.msg-content').innerHTML = marked.parse(
                            assistantDiv.querySelector('.msg-content').textContent
                        );
                    } else if (data.type === 'done') {
                        // 刷新页面以更新内容
                        setTimeout(() => location.reload(), 500);
                    }
                }
            }
        }
    } catch(e) {
        assistantDiv.querySelector('.msg-content').textContent = '[错误] ' + e.message;
    }
    document.getElementById('btn-send').disabled = false;
}

function appendMessage(role, content) {
    const container = document.getElementById('chat-messages');
    // 移除 placeholder
    const ph = container.querySelector('.chat-placeholder');
    if (ph) ph.remove();

    const div = document.createElement('div');
    div.className = `chat-msg msg-${role}`;
    div.innerHTML = `<div class="msg-role">${role === 'user' ? '你' : 'AI'}</div>
                     <div class="msg-content">${role === 'assistant' ? marked.parse(content) : content}</div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
}

function useForOutline(ideaId) {
    window.location.href = `/outlines?idea_id=${ideaId}`;
}

function editContent() {
    const contentDiv = document.getElementById('idea-content');
    const currentText = {{ idea.content | tojson | safe }};
    const textarea = document.createElement('textarea');
    textarea.value = currentText;
    textarea.className = 'form-textarea';
    textarea.style.minHeight = '400px';
    textarea.id = 'edit-textarea';
    contentDiv.innerHTML = '';
    contentDiv.appendChild(textarea);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn btn-primary';
    saveBtn.textContent = '保存修改';
    saveBtn.style.marginTop = '10px';
    saveBtn.onclick = async () => {
        const newContent = document.getElementById('edit-textarea').value;
        await fetch(`/api/ideas/save`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title: {{ idea.title | tojson | safe }},
                content: newContent,
                chat_history: {{ idea.chat_history | tojson | safe }}
            })
        });
        location.reload();
    };
    contentDiv.parentElement.appendChild(saveBtn);
}
</script>
{% endblock %}
